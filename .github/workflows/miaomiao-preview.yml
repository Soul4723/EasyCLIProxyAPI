name: Miaomiao preview

on:
  workflow_run:
    workflows: [Build portable releases]
    types: [completed]
  push:
    branches: [miaomiao]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miaomiao-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Merge eligible PR and resolve preview commit
    if: >-
      github.repository == 'router-for-me/EasyCLIProxyAPI'
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/miaomiao')
      || (github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      pr: ${{ steps.source.outputs.pr }}
    steps:
      # Use trusted inline code only. Never execute PR source in this job.
      - name: Resolve source
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === 'push' || context.eventName === 'workflow_dispatch') {
              if (context.ref === 'refs/heads/miaomiao' && !context.payload.deleted) {
                core.setOutput('sha', context.sha);
              }
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.payload.workflow_run.id,
            });
            if (run.event !== 'pull_request' || run.status !== 'completed'
                || run.conclusion !== 'success' || run.path !== '.github/workflows/release.yml'
                || run.repository.full_name !== `${owner}/${repo}`) return;

            // Fork runs can have an empty pull_requests array; query open PRs instead.
            const candidates = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'miaomiao', per_page: 100,
            });
            for (const candidate of candidates) {
              if (candidate.user.login !== 'Roomen' || candidate.head.sha !== run.head_sha) continue;
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: candidate.number,
              });
              if (pr.user.login !== 'Roomen' || pr.base.ref !== 'miaomiao'
                  || pr.base.repo.full_name !== `${owner}/${repo}`
                  || pr.state !== 'open' || pr.draft || pr.head.sha !== run.head_sha
                  || pr.head.repo?.full_name !== run.head_repository?.full_name) continue;

              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              const required = ['Resolve app version', ...['linux', 'darwin', 'windows']
                .flatMap(os => ['amd64', 'aarch64'].map(arch => `Build ${os}-${arch}`))];
              if (!required.every(name => jobs.some(job => job.name === name && job.conclusion === 'success'))) {
                core.info('The full six-platform PR build did not pass; skipping merge.');
                continue;
              }

              // SHA locking prevents a newer, untested revision from being merged.
              // GitHub still enforces conflicts and branch protection.
              const { data: result } = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, sha: pr.head.sha, merge_method: 'merge',
              });
              if (!result.merged) throw new Error(`PR #${pr.number} was not merged: ${result.message}`);
              core.setOutput('sha', result.sha);
              core.setOutput('pr', String(pr.number));
              return;
            }

  preview:
    name: Build and publish merged preview
    needs: source
    if: needs.source.outputs.sha != ''
    permissions:
      contents: write
    # Token merges do not trigger push workflows; explicitly build the merged SHA.
    uses: ./.github/workflows/release.yml
    with:
      preview: true
      source_sha: ${{ needs.source.outputs.sha }}
    secrets: inherit

  notify:
    name: Link preview on merged PR
    needs: [source, preview]
    if: needs.source.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.source.outputs.pr }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: tag } = await github.rest.git.getRef({ owner, repo, ref: 'tags/miaomiao-preview' });
            if (tag.object.sha !== process.env.SOURCE_SHA) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: Number(process.env.PR_NUMBER),
              body: `已自动合并并发布 [Miaomiao Preview](https://github.com/${owner}/${repo}/releases/tag/miaomiao-preview)。\n\n构建提交：${process.env.SOURCE_SHA}\n\n下载页为滚动预览版，后续成功构建会替换安装包。`,
            });
